services:
  - type: web
    runtime: docker
    name: consulta-loa-piloto
    region: oregon
    plan: free
    healthCheckPath: /
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTH_REQUIRED
        value: "true"
      - key: PILOT_EDUCATION_ONLY
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: FEEDBACK_DATABASE_URL
        fromDatabase:
          name: consulta-loa-feedback
          property: connectionString
      - key: EDITOR_EMAILS
        sync: false
      - key: REVIEWER_EMAILS
        sync: false
      - key: CLOUDFLARE_ACCESS_TEAM_DOMAIN
        value: https://access-not-configured.invalid
      - key: CLOUDFLARE_ACCESS_AUDIENCE
        value: pending-configuration
databases:
  - name: consulta-loa-feedback
    plan: free
    region: oregon
