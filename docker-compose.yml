services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: loa
      POSTGRES_USER: loa
      POSTGRES_PASSWORD: loa
    ports:
      - "5432:5432"
    volumes:
      - loa_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loa -d loa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  loa_postgres:

