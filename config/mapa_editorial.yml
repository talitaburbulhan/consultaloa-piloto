rules:
  - rule_key: no_cross_level_sum
    subject_slug: global
    rule_type: aggregation
    payload: {total_orgao: canonical, subtotal_unidade: component, total_programa: detail_only, valor_acao: detail_only}
    source_checkpoint: human-editorial-validation-stage-complete-20260831.json
  - rule_key: absence_is_not_zero
    subject_slug: global
    rule_type: missingness
    payload: {absence: no_record, explicit_zero: preserve}
    source_checkpoint: human-editorial-validation-stage-complete-20260831.json
  - rule_key: retrospective_does_not_overwrite
    subject_slug: global
    rule_type: evidence_precedence
    payload: {primary: own_exercise_document, retrospective: documentary_divergence_only}
    source_checkpoint: human-editorial-validation-stage-complete-20260831.json
  - rule_key: historical_segments_are_not_equivalent
    subject_slug: global
    rule_type: historical_comparison
    payload: {comparative_sequence: allowed, disclose_code_changes: true, automatic_equivalence: false, automatic_sum: false, retroactive_code_replacement: false}
    source_checkpoint: human-editorial-validation-stage-complete-20260831.json
  - rule_key: supervised_programs_stay_separate
    subject_slug: global
    rule_type: aggregation
    payload: {code_prefix: "93", presentation: separate, automatic_sum: false, project_missing_years: false}
    source_checkpoint: human-editorial-validation-stage-complete-20260831.json
  - rule_key: inb_budget_regime_break
    subject_slug: inb
    rule_type: regime_transition
    payload: {fiscal_seguridade: "2019-2022", investimento_estatais: "2023-2026", continuous_quantitative_series: false, direct_comparison: false, automatic_sum: false}
